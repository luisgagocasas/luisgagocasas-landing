<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada — Luis Gago Casas</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Manrope', sans-serif;
        background: #7c3aed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: #ffffff;
        border-radius: 20px;
        padding: 56px 48px;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 24px 64px rgba(0,0,0,0.18);
      }
      .shield-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        background: #f5f3ff;
        border-radius: 50%;
        margin-bottom: 28px;
      }
      .shield-wrap svg { width: 36px; height: 36px; color: #7c3aed; }
      .error-code {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7c3aed;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 800;
        color: #0f172a;
        line-height: 1.15;
        margin-bottom: 16px;
      }
      p {
        font-size: 0.95rem;
        color: #64748b;
        line-height: 1.75;
        margin-bottom: 32px;
      }
      .btn-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 28px;
        background: #7c3aed;
        color: #ffffff;
        font-family: 'Manrope', sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        border-radius: 8px;
        text-decoration: none;
        transition: background 150ms, transform 150ms;
        margin-bottom: 40px;
      }
      .btn-home:hover { background: #6d28d9; transform: translateY(-1px); }
      .protected-by {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a78bfa;
        background: #f5f3ff;
        border: 1px solid #ddd6fe;
        border-radius: 999px;
        padding: 6px 14px 6px 10px;
        text-decoration: none;
        transition: background 150ms, color 150ms;
      }
      .protected-by:hover { background: #ede9fe; color: #7c3aed; }
      .protected-by svg { width: 14px; height: 14px; color: #7c3aed; flex-shrink: 0; }
      @media (max-width: 480px) {
        .card { padding: 40px 28px; }
        h1 { font-size: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="shield-wrap">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 1.5L2.5 4.5v5c0 4.142 3.134 7.82 7.5 8.5 4.366-.68 7.5-4.358 7.5-8.5v-5L10 1.5z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M7 10l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <p class="error-code">Error 404</p>
      <h1>Página no encontrada</h1>
      <p>
        La página que buscas no existe o fue movida.<br />
        Este sitio está protegido por <strong>Ayphu Cloud</strong> —<br />
        el acceso a rutas no autorizadas queda registrado.
      </p>

      <a href="/" class="btn-home">Volver al inicio</a>

      <br />

      <a href="https://ayphu.com" class="protected-by" target="_blank" rel="noreferrer noopener">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 1.5L2.5 4.5v5c0 4.142 3.134 7.82 7.5 8.5 4.366-.68 7.5-4.358 7.5-8.5v-5L10 1.5z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M7 10l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Protegido por Ayphu Cloud
      </a>
    </div>
  </body>
</html>
